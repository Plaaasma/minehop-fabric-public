plugins {
    // see https://fabricmc.net/develop/ for new versions. Minecraft 1.21.11 is still obfuscated, so Loom's remapping
    // variant is used. Loom 1.14+ and ForgeGradle 7 need Gradle 9; Loom 1.18 needs Gradle running on Java 25
    // (gradle/gradle-daemon-jvm.properties), the mod itself still targets Java 21.
    id 'net.fabricmc.fabric-loom-remap' version '1.18.2' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.148' apply false
}
