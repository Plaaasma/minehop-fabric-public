# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.1.7
group=net.nerdorg.minehop
java_version=21

# Common
minecraft_version=1.21.11
mod_name=Minehop
mod_author=Plaaasma, lolrow, Moriz
mod_id=minehop
license=ARR (All Rights Reserved)
credits=
description=An all in one bhopping mod for minecraft!
minecraft_version_range=[1.21.11, 1.21.12)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050

# Fabric
fabric_version=0.141.6+1.21.11
fabric_loader_version=0.19.5
modmenu_version=17.0.1

# Forge
forge_version=61.2.1
forge_loader_version_range=[61,)

# NeoForge
neoforge_version=21.11.45
neoforge_loader_version_range=[4,)

# Shared mod dependencies
cloth_version=21.11.153
jda_version=5.0.0-beta.21

# Gradle
org.gradle.jvmargs=-Xmx8G
org.gradle.parallel=true
