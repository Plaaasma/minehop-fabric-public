# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.1.6
group=net.nerdorg.minehop
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Minehop
mod_author=Plaaasma, lolrow, Moriz
mod_id=minehop
license=ARR (All Rights Reserved)
credits=
description=An all in one bhopping mod for minecraft!
minecraft_version_range=[1.20.1, 1.20.2)
## 'common' is compiled against vanilla Minecraft through ModDevGradle legacyforge's MCP mode (mcpVersion =
## minecraft_version), like MultiLoader-Template 1.20.1.

# Fabric
fabric_version=0.92.12+1.20.1
fabric_loader_version=0.16.13
modmenu_version=7.2.2

# Forge (ModDevGradle legacyforge, like MultiLoader-Template 1.20.1)
forge_version=47.4.26
forge_loader_version_range=[47,)
# Lowest Forge (or legacy NeoForge 1.20.1, which reports itself as forge 47.1.x) the jar declares support for
forge_min_version=47.1

# Shared mod dependencies
cloth_version=11.1.136
jda_version=5.0.0-beta.21

# Gradle
org.gradle.jvmargs=-Xmx8G
org.gradle.parallel=true
