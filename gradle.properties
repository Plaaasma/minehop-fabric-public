# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.1.7
group=net.nerdorg.minehop
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Minehop
mod_author=Plaaasma, lolrow, Moriz
mod_id=minehop
license=ARR (All Rights Reserved)
credits=
description=An all in one bhopping mod for minecraft!
minecraft_version_range=[26.1.2, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric
fabric_version=0.155.3+26.1.2
fabric_loader_version=0.19.5
modmenu_version=18.0.2

# Forge (phase 3: module excluded from settings.gradle until implemented)
forge_version=64.1.3
forge_loader_version_range=[64,)

# NeoForge (phase 3: module excluded from settings.gradle until implemented)
neoforge_version=26.1.2.114
neoforge_loader_version_range=[4,)

# Shared mod dependencies
cloth_version=26.1.154
jda_version=5.0.0-beta.21

# ForgeGradle 7: put the forge module's classes and resources in one output directory, so the dev runs see one
# mod module (otherwise FML loads the classes twice: "Modules main and minehop export package ...").
net.minecraftforge.gradle.merge-source-sets=true

# Gradle
org.gradle.jvmargs=-Xmx8G
org.gradle.parallel=true
