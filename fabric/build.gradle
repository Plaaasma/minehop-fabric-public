plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Discord bot. Packaging is deliberately unchanged from the single-module build: `implementation` puts JDA on the
    // compile and dev-runtime classpaths only; it is NOT jar-in-jar'd (`include`) into the remapped mod jar
    // (it is only bundled by the separate `jarWithType` fat jar below).
    implementation "net.dv8tion:JDA:${jda_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        // Both runs keep using the repository-level run/ directory (world, MineHop_Data, configs), like the
        // single-module build did.
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('../run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('../run')
        }
        // `gradlew :fabric:runServer -Ptestserver`: local copy of the real test server (world + MineHop_Data) in
        // its own run dir, so it never shares logs/latest.log or config with runClient / the movement
        // harness, which keep using run/.
        if (project.hasProperty("testserver")) {
            server {
                runDir('../run-testserver')
            }
        }
    }
}

fabricApi {
    configureDataGeneration()
}

processResources {
    // Common's access transformer is for NeoForge/NeoForm only (Fabric API's transitive access wideners already open
    // those members on Fabric); keep the Fabric jar's resources exactly as before the multiloader migration.
    exclude 'META-INF/accesstransformer.cfg'
}

tasks.named("runClient") {
    args "--width", "384", "--height", "216"
}

tasks.named("runServer") {
    if (project.hasProperty("movementtest")) {
        jvmArgs "-Dminehop.movementtest=true"
    }
    if (project.hasProperty("surfHull")) {
        jvmArgs "-Dminehop.surfHullSolver=true"
    }
}

tasks.register('jarWithType', Jar) {
    archiveClassifier = 'all'
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    duplicatesStrategy = 'exclude'  // Handling duplicate entries strategy
    doFirst {
        from(configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) })
    }
}

publishing.publications.named('mavenJava', MavenPublication) {
    artifact tasks.named('jarWithType')
}
