pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    // Toolchain download repository for gradle/gradle-daemon-jvm.properties (Loom 1.18 needs Gradle on Java 25;
    // Gradle auto-provisions a JDK 25 for the daemon if none is installed).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// rootProject.name is left at its default (the checkout folder name): the worktrees of this repo live in
// differently named folders, and IDEA wants the root project name to match the folder
// (https://youtrack.jetbrains.com/issue/IDEA-317606).
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')
include('forge')
